[project]
name = "tiny-minds"
version = "0.1.0"
description = "Evolving tiny transformer neural networks in a primordial soup"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["artificial-life", "evolution", "transformer", "neural-network", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

dependencies = [
    "torch>=2.0.0",
    "pygame>=2.5.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
]

[project.optional-dependencies]
video = [
    "imageio-ffmpeg>=0.4.8",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/tiny-minds"
Repository = "https://github.com/yourusername/tiny-minds"

[project.scripts]
tiny-minds = "src.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
